# Palmetto standard LIGHT pull-request checks (lint, typecheck, quick tests, secret
# scan of the PR's commits; docs-only changes exit fast). The heavy gates run in
# Create Release. Calls the central reusable workflow, which runs on
# the GitHub-hosted ARM runner (ubuntu-24.04-arm). Do not override runner-small:
# the label lives in the central workflow.
# The required status check for main is "pi-checks / pi-checks", so keep the job id.
name: PI Checks

on:
  pull_request:

permissions: {}

concurrency:
  group: pi-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pi-checks:
    permissions:
      contents: read
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-checks.yml@d7c8077f09cfeffc3cf660081c9499c0911826c5 # v1
    with:
      stack: node # node | python | go | rust | tofu | docs
