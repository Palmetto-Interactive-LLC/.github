# Palmetto standard delivery for apps on ECS. On merge to main: build the amd64
# image, push it to ECR by full git SHA, deploy STAGING and wait for it to be
# stable. Production is never deployed from here; it goes out only through the
# manual "Create Release" workflow (create-release.yml).
# Runs on the org CodeBuild runner (codebuild-pi-actions); amd64 images build on Depot
# (depot build, GitHub OIDC; the Depot project must trust this repository). Do not override the runner inputs: the label lives in the central workflow.
# Replace __APP__ (ECR <app>/web, services <app>-staging and <app>-prod) and
# __CLUSTER__ (the ECS cluster).
# Inert until the repository variable ECS_DEPLOY_ENABLED is 'true'.
name: PI Deliver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deliver:
    permissions:
      contents: write # the shared workflow's release job asks for it; staging never uses it
      id-token: write
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-deliver.yml@d7c8077f09cfeffc3cf660081c9499c0911826c5 # v1
    with:
      app: __APP__
      cluster: __CLUSTER__
      # images: '[{"name":"web","dockerfile":"Dockerfile","context":"."}]'
      # services: '["__APP__"]'
      # migrate-command: npm run migrate
