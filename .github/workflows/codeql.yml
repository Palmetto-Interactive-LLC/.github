name: "CodeQL PUBLIC-REPO-ONLY"

# PUBLIC-REPO-ONLY: CodeQL analysis uploads require public repositories or GitHub
# Advanced Security licensing. This workflow is intentionally not a required check
# for private GitHub Team template repositories.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql-public-repo-only:
    name: "CodeQL PUBLIC-REPO-ONLY"
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript,python
          queries: security-extended,security-and-quality

      - name: Autobuild
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          else
            echo "No buildable package detected; CodeQL will analyze source directly."
          fi

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
