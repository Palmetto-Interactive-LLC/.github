# Palmetto production release (reusable). The standard caller is a workflow
# named exactly "Create Release" that runs on workflow_dispatch from main and
# nothing else (templates: pi-release.yml). Steps, in order:
#
#   1. gates: pi-checks.yml in release mode (full test suite, build, dependency
#      audit, full-history secret scan, actionlint and zizmor, release-gate-command).
#   2. pi-deliver.yml in release mode: take the image already built and
#      deployed to staging for this commit (no rebuild), gate on ECR's CRITICAL
#      scan of that exact digest, cut the tag vYYYY.MM.DD.N and the GitHub
#      Release, then deploy the same digest to prod with the migration.
#   With the dispatch input rollback_to set, gates and the release are skipped
#   and pi-deliver redeploys that existing image to rollback_env instead.
#
# The caller's workflow_dispatch declares these optional inputs (the templates do):
#   sha          full commit SHA on main to release; default is main's head. Its
#                already-built image is released, so the SHA must be on main and
#                its image must exist in ECR. A non-head SHA is a deliberate choice.
#   requested_by free text (the Slack release button puts the requester here).
#   dry_run      true: only the heavy gates and the ECR scan of the image; no tag,
#                no deploy, no notification.
#   rollback_to / rollback_env: the rollback path.
# Outputs (and the notify job): release_url, release_tag, app_url, image_digest, run_url.
#
# deploy: false (pi-platform and other repos with no ECS service) runs the gates
# and cuts the release tag with nothing to deploy.
#
# Prod deploys happen only here, and only on a manual run: pi-deliver refuses
# mode release or rollback unless the event is workflow_dispatch on main.
# The caller grants contents: write and id-token: write and uses no
# "environment:". Runner labels: runner-small and runner-build (JSON arrays of
# labels) are forwarded to every job below; this file is where they are read.
name: PI Release

on:
  workflow_call:
    inputs:
      app:
        description: App name. ECR repositories are <app>/<image name>; services are <service>-<env>.
        type: string
      cluster:
        description: ECS cluster name.
        type: string
      runner-build:
        description: runs-on for the image build, as a JSON array of labels. Defaults to the GitHub-hosted ARM runner. Must be an arm64 runner with Docker. Callers should not override it.
        type: string
        default: '["ubuntu-24.04-arm"]'
      runner-small:
        description: runs-on for the deploy jobs (same format as runner-build).
        type: string
        default: '["ubuntu-24.04-arm"]'
      images:
        description: JSON list of {name, dockerfile, context[, container]}. name is the ECR repository suffix (<app>/<name>). container defaults to the main container for name "web" and to name otherwise.
        type: string
        default: '[{"name":"web","dockerfile":"Dockerfile","context":"."}]'
      services:
        description: JSON list of service app names. Defaults to [app]. Each runs as <service>-<env>.
        type: string
        default: ''
      container-name:
        description: Main container name (receives the "web" image).
        type: string
        default: web
      migrate-command:
        description: Optional pre-deploy migration, run once per environment as a one-off ECS task from the new task definition. A plain string runs under "sh -c". A JSON array is used as the exact command (distroless images).
        type: string
        default: ''
      migrate-secrets:
        description: 'Optional JSON of extra Secrets Manager references for the migration task only: {"<env>": {"ENV_VAR": "<secret name or ARN>"}}.'
        type: string
        default: ''
      stable-timeout-minutes:
        type: number
        default: 15
      scan-allowlist:
        description: 'Path, in the caller repository, of the ECR scan allowlist: CRITICAL findings it names (with a reason and an optional expiry) do not fail the build. A missing file is an empty allowlist. See README.md.'
        type: string
        default: .github/ecr-scan-allowlist.json
      scan-timeout-minutes:
        description: How long to wait for the ECR image scan to complete, per image.
        type: number
        default: 10
      stack:
        description: 'Toolchain and default commands: node | python | go | rust | tofu | docs'
        type: string
        default: node
      working-directory:
        description: Directory the install/lint/typecheck/test/build commands run in.
        type: string
        default: .
      node-version:
        type: string
        default: '22'
      python-version:
        type: string
        default: '3.12'
      go-version:
        description: Empty means read the version from go.mod.
        type: string
        default: ''
      rust-toolchain:
        type: string
        default: stable
      tofu-version:
        type: string
        default: 1.11.5
      install-command:
        description: Overrides the stack default. "-" skips the phase.
        type: string
        default: ''
      lint-command:
        description: Overrides the stack default. "-" skips the phase.
        type: string
        default: ''
      typecheck-command:
        description: Overrides the stack default. "-" skips the phase.
        type: string
        default: ''
      test-command:
        description: The FULL test suite. Release mode only. Overrides the stack default. "-" skips the phase.
        type: string
        default: ''
      quick-test-command:
        description: 'Fast unit tests for pull requests (target: seconds). Empty means the node scripts test:quick or test:unit when one exists, and nothing for other stacks. "-" skips the phase.'
        type: string
        default: ''
      build-command:
        description: Release mode only. Overrides the stack default. "-" skips the phase.
        type: string
        default: ''
      release-gate-command:
        description: Extra heavy gate for a release (IaC and policy checks, cost gates, integration suites). Runs after the standard release phases, in the working directory. Empty or "-" skips it.
        type: string
        default: ''
      has-staging:
        description: "true (default): the app has staging services. false: no staging environment; a merge only builds the image and a release skips the staging-digest check."
        type: boolean
        default: true
      app-url:
        description: "The production URL reported as app_url. Empty falls back to the APP_URL repository variable."
        type: string
        default: ""
      deploy:
        description: "true (default): deploy prod through pi-deliver. false: gates plus a release tag only, for repositories with no ECS service (pi-platform)."
        type: boolean
        default: true
    outputs:
      release_url:
        description: URL of the GitHub Release (empty for a dry run or rollback).
        value: ${{ jobs.notify.outputs.release_url }}
      release_tag:
        description: The release tag vYYYY.MM.DD.N (empty for a dry run or rollback).
        value: ${{ jobs.notify.outputs.release_tag }}
      app_url:
        description: The production URL.
        value: ${{ jobs.notify.outputs.app_url }}
      image_digest:
        description: Digest of the released (or rolled back) image.
        value: ${{ jobs.notify.outputs.image_digest }}
      run_url:
        description: URL of this workflow run.
        value: ${{ jobs.notify.outputs.run_url }}

permissions: {}

jobs:
  mode:
    name: mode
    runs-on: ${{ fromJSON(inputs.runner-small) }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      sha: ${{ steps.mode.outputs.sha }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      requested_by: ${{ steps.mode.outputs.requested_by }}
    steps:
      - name: Only a manual run from main may release
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROLLBACK_TO: ${{ github.event.inputs.rollback_to }}
          RELEASE_SHA: ${{ github.event.inputs.sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REQUESTED_BY: ${{ github.event.inputs.requested_by }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" != "workflow_dispatch" || test "$GITHUB_REF" != "refs/heads/main"; then
            echo "::error::Create Release runs only as a workflow_dispatch on refs/heads/main (this is ${EVENT_NAME} on ${GITHUB_REF})."; exit 1
          fi
          {
            echo "dry_run=$(test "$DRY_RUN" = "true" && echo true || echo false)"
            printf 'requested_by=%s\n' "$(printf '%s' "$REQUESTED_BY" | tr -d '\r\n' | cut -c1-200)"
          } >> "$GITHUB_OUTPUT"
          if test -n "$ROLLBACK_TO"; then
            echo "mode=rollback" >> "$GITHUB_OUTPUT"; echo "sha=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "mode=release" >> "$GITHUB_OUTPUT"
          if test -z "$RELEASE_SHA"; then echo "sha=" >> "$GITHUB_OUTPUT"; exit 0; fi
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA."; exit 1; }
          rel="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${RELEASE_SHA}...main" | jq -r '.status')"
          case "$rel" in identical|ahead) ;; *) echo "::error::${RELEASE_SHA} is not on main (compare says '${rel}')."; exit 1;; esac
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

  gates:
    name: Heavy gates
    needs: mode
    if: needs.mode.outputs.mode == 'release'
    permissions:
      contents: read
    uses: ./.github/workflows/pi-checks.yml
    with:
      mode: release
      ref: ${{ needs.mode.outputs.sha }}
      runner-small: ${{ inputs.runner-small }}
      stack: ${{ inputs.stack }}
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}
      python-version: ${{ inputs.python-version }}
      go-version: ${{ inputs.go-version }}
      rust-toolchain: ${{ inputs.rust-toolchain }}
      tofu-version: ${{ inputs.tofu-version }}
      install-command: ${{ inputs.install-command }}
      lint-command: ${{ inputs.lint-command }}
      typecheck-command: ${{ inputs.typecheck-command }}
      test-command: ${{ inputs.test-command }}
      quick-test-command: ${{ inputs.quick-test-command }}
      build-command: ${{ inputs.build-command }}
      release-gate-command: ${{ inputs.release-gate-command }}
  deliver:
    name: Release to prod
    needs: [mode, gates]
    if: ${{ !cancelled() && inputs.deploy && needs.mode.result == 'success' && (needs.gates.result == 'success' || needs.gates.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/pi-deliver.yml
    with:
      mode: ${{ needs.mode.outputs.mode }}
      has-staging: ${{ inputs.has-staging }}
      app: ${{ inputs.app }}
      cluster: ${{ inputs.cluster }}
      runner-build: ${{ inputs.runner-build }}
      runner-small: ${{ inputs.runner-small }}
      images: ${{ inputs.images }}
      services: ${{ inputs.services }}
      container-name: ${{ inputs.container-name }}
      migrate-command: ${{ inputs.migrate-command }}
      migrate-secrets: ${{ inputs.migrate-secrets }}
      stable-timeout-minutes: ${{ inputs.stable-timeout-minutes }}
      scan-allowlist: ${{ inputs.scan-allowlist }}
      scan-timeout-minutes: ${{ inputs.scan-timeout-minutes }}
  # No ECS service: the gates passed, so cut the tag and the GitHub Release.
  tag:
    name: Cut release
    needs: [mode, gates]
    if: ${{ !inputs.deploy && needs.mode.outputs.mode == 'release' && needs.mode.outputs.dry_run != 'true' && needs.gates.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runner-small) }}
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cut.outputs.version }}
    steps:
      - name: Cut the release (annotated tag and GitHub Release)
        id: cut
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.mode.outputs.sha || github.sha }}
          EXPLICIT_SHA: ${{ needs.mode.outputs.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${SOURCE_REPOSITORY}"
          req() {
            local method="$1" url="$2" data="${3:-}" try
            for try in 1 2 3 4 5; do
              if test -n "$data"; then
                body="$(curl -sS -X "$method" -w '\n%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$url" -d "$data")"
              else
                body="$(curl -sS -X "$method" -w '\n%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$url")"
              fi
              code="${body##*$'\n'}"; body="${body%$'\n'*}"
              case "$code" in 403|429|500|502|503|504) echo "::warning::${method} ${url} returned ${code} (attempt ${try}/5): ${body:0:300}"; sleep $((try * 5));; *) return 0;; esac
            done
          }
          # Head check: a release is always of the head of main.
          req GET "${api}/git/ref/heads/main"
          head="$(jq -r '.object.sha // empty' <<<"$body")"
          if test -z "$EXPLICIT_SHA"; then
            test "$head" = "$SOURCE_SHA" || { echo "::error::${SOURCE_SHA} is not the head of main (${head})."; exit 1; }
          fi
          # Version: reuse the tag this commit already has, else the next vYYYY.MM.DD.N.
          req GET "${api}/tags?per_page=100"
          existing="$(jq -r --arg sha "$SOURCE_SHA" '[.[] | select(.commit.sha == $sha and (.name | test("^v[0-9]{4}[.][0-9]{2}[.][0-9]{2}[.][0-9]+$")))][0].name // empty' <<<"$body")"
          if test -n "$existing"; then
            VERSION="$existing"
          else
            prefix="v$(date -u +%Y.%m.%d)."
            req GET "${api}/git/matching-refs/tags/${prefix}"
            last="$(jq -r --arg p "refs/tags/${prefix}" '[.[].ref | ltrimstr($p) | select(test("^[0-9]+$")) | tonumber] | max // 0' <<<"$body")"
            VERSION="${prefix}$((last + 1))"
          fi
          req GET "${api}/git/ref/tags/${VERSION}"
          if test "$code" = "404"; then
            req POST "${api}/git/tags" "$(jq -nc --arg tag "$VERSION" --arg sha "$SOURCE_SHA" '{tag:$tag, message:("Release " + $tag), object:$sha, type:"commit"}')"
            tag_sha="$(jq -r '.sha // empty' <<<"$body")"
            test -n "$tag_sha" || { echo "::error::Could not create tag object ${VERSION} (HTTP ${code}): ${body:0:300}"; exit 1; }
            req POST "${api}/git/refs" "$(jq -nc --arg ref "refs/tags/${VERSION}" --arg sha "$tag_sha" '{ref:$ref, sha:$sha}')"
            case "$code" in 201) echo "Created tag ${VERSION}";; 422) echo "Tag ${VERSION} was created by a concurrent attempt.";; *) echo "::error::Could not create tag ${VERSION} (HTTP ${code}): ${body:0:300}"; exit 1;; esac
          elif test "$code" != "200"; then
            echo "::error::Unexpected HTTP ${code} reading tag ${VERSION}: ${body:0:300}"; exit 1
          fi
          req GET "${api}/commits/${VERSION}"
          test "$(jq -r '.sha // empty' <<<"$body")" = "$SOURCE_SHA" || { echo "::error::Tag ${VERSION} does not point at ${SOURCE_SHA}."; exit 1; }
          req GET "${api}/releases/tags/${VERSION}"
          if test "$code" = "404"; then
            rel_body="Commit: ${SOURCE_SHA}"$'\n'"Workflow run: ${RUN_URL}"
            req POST "${api}/releases" "$(jq -nc --arg tag "$VERSION" --arg body "$rel_body" '{tag_name:$tag, name:$tag, body:$body, generate_release_notes:true, make_latest:"true"}')"
            case "$code" in 201) echo "Created GitHub Release ${VERSION}";; 422) echo "Release ${VERSION} was created by a concurrent attempt.";; *) echo "::error::Could not create release ${VERSION} (HTTP ${code}): ${body:0:300}"; exit 1;; esac
          elif test "$code" = "200"; then
            echo "Release ${VERSION} already exists."
          else
            echo "::error::Unexpected HTTP ${code} reading release ${VERSION}: ${body:0:300}"; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Release ${VERSION} (${SOURCE_SHA})" >> "$GITHUB_STEP_SUMMARY"

  # Always runs, success or failure, once everything else has finished. It sets
  # the workflow outputs and tells the release bot (Slack #client-releases) how
  # the run ended. Nothing here can fail the release: the notification steps are
  # continue-on-error, and the job is skipped for dry runs.
  notify:
    name: Notify
    needs: [mode, gates, deliver, tag]
    if: ${{ always() && needs.mode.outputs.dry_run != 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-small) }}
    timeout-minutes: 10
    permissions:
      id-token: write
    outputs:
      release_url: ${{ steps.result.outputs.release_url }}
      release_tag: ${{ steps.result.outputs.release_tag }}
      app_url: ${{ steps.result.outputs.app_url }}
      image_digest: ${{ steps.result.outputs.image_digest }}
      run_url: ${{ steps.result.outputs.run_url }}
    env:
      NOTIFY_ROLE_ARN: ${{ vars.PI_RELEASE_NOTIFY_ROLE_ARN }}
    steps:
      - name: Work out the result
        id: result
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          APP_URL_INPUT: ${{ inputs.app-url }}
          APP_URL_VAR: ${{ vars.APP_URL }}
          RELEASE_SHA: ${{ needs.mode.outputs.sha }}
          REQUESTED_BY: ${{ needs.mode.outputs.requested_by }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          results="$(jq -r '[.[].result] | join(" ")' <<<"$NEEDS")"
          conclusion=success
          case " $results " in *" failure "*) conclusion=failure;; *" cancelled "*) conclusion=cancelled;; esac
          mode="$(jq -r '.mode.outputs.mode // "release"' <<<"$NEEDS")"
          [ -n "$mode" ] || mode=release
          tag=""
          if test "$mode" = "release"; then
            tag="$(jq -r '(.deliver.outputs.version // .tag.outputs.version // "")' <<<"$NEEDS")"
            case "$tag" in v[0-9]*) ;; *) tag="";; esac
          fi
          release_url=""
          if test -n "$tag"; then release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"; fi
          app_url="${APP_URL_INPUT:-$APP_URL_VAR}"
          digest="$(jq -r '.deliver.outputs.image_digest // ""' <<<"$NEEDS")"
          sha="$(jq -r '.deliver.outputs.sha // ""' <<<"$NEEDS")"
          [ -n "$sha" ] || sha="${RELEASE_SHA:-$GITHUB_SHA}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "conclusion=${conclusion}"; echo "mode=${mode}"; echo "sha=${sha}"
            echo "release_tag=${tag}"; echo "release_url=${release_url}"; echo "app_url=${app_url}"
            echo "image_digest=${digest}"; echo "run_url=${run_url}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Create Release: ${conclusion} (${mode})"
            echo "- Commit: \`${sha}\`"
            test -z "$tag" || echo "- Release: ${release_url}"
            test -z "$digest" || echo "- Image: \`${digest}\`"
            test -z "$REQUESTED_BY" || echo "- Requested by: ${REQUESTED_BY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No release notifier configured
        if: ${{ env.NOTIFY_ROLE_ARN == '' }}
        shell: bash
        run: echo "::warning::PI_RELEASE_NOTIFY_ROLE_ARN is not set for this repository; no Slack notification."

      - name: Configure AWS credentials through GitHub OIDC (release notify)
        if: ${{ env.NOTIFY_ROLE_ARN != '' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-1
          role-session-name: pi-release-notify-${{ github.run_id }}
          role-to-assume: ${{ vars.PI_RELEASE_NOTIFY_ROLE_ARN }}

      - name: Tell the release bot
        if: ${{ env.NOTIFY_ROLE_ARN != '' }}
        continue-on-error: true
        shell: bash
        env:
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          MODE: ${{ steps.result.outputs.mode }}
          SHA: ${{ steps.result.outputs.sha }}
          REQUESTED_BY: ${{ needs.mode.outputs.requested_by }}
          RELEASE_TAG: ${{ steps.result.outputs.release_tag }}
          RELEASE_URL: ${{ steps.result.outputs.release_url }}
          APP_URL: ${{ steps.result.outputs.app_url }}
          IMAGE_DIGEST: ${{ steps.result.outputs.image_digest }}
          RUN_URL: ${{ steps.result.outputs.run_url }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg repository "$GITHUB_REPOSITORY" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$RUN_ATTEMPT" \
            --arg conclusion "$CONCLUSION" --arg mode "$MODE" --arg sha "$SHA" --arg requested_by "$REQUESTED_BY" \
            --arg release_tag "$RELEASE_TAG" --arg release_url "$RELEASE_URL" --arg app_url "$APP_URL" \
            --arg image_digest "$IMAGE_DIGEST" --arg run_url "$RUN_URL" \
            '{action:"release_result", repository:$repository, run_id:$run_id, run_attempt:$run_attempt, conclusion:$conclusion, mode:$mode, sha:$sha, requested_by:$requested_by, release_tag:$release_tag, release_url:$release_url, app_url:$app_url, image_digest:$image_digest, run_url:$run_url}')"
          aws lambda invoke --function-name pi-release-notify --cli-binary-format raw-in-base64-out --payload "$payload" "$RUNNER_TEMP/notify.json" >/dev/null
          echo "Release bot notified (${CONCLUSION})."
