# Palmetto standard checks. Calls the central reusable workflow, which runs on
# the Marsh runners ([self-hosted, daytona]) by default. The repository must be
# in the "daytona" runner group.
# The required status check for main is "pi-checks / pi-checks", so keep the job id.
name: PI Checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pi-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pi-checks:
    permissions:
      contents: read
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-checks.yml@abe3c0163c0b14af64dc891428a03d72b7a599db # v1
    with:
      stack: node # node | python | go | rust | tofu | docs
      # runner-small: '["self-hosted","daytona"]'  # the default; JSON array of labels
