# Dogfoods the central pi-checks workflow on this repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pi-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/pi-checks.yml
    with:
      stack: docs
      # TODO(PAL-1022): this repository is public, and the Marsh "daytona" runner
      # group does not accept public repositories (allows_public_repositories is
      # false). Run on a GitHub-hosted runner until that changes, then delete this
      # input so the Marsh default applies.
      runner-small: '["ubuntu-latest"]'
