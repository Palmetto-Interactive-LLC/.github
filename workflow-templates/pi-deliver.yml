# Palmetto standard delivery for apps on ECS. On merge to main: build the arm64
# image, push it to ECR by full git SHA, deploy staging, wait for it to be stable,
# cut the release tag vYYYY.MM.DD.N, then deploy the same digest to prod.
# Replace __APP__ (ECR <app>/web, services <app>-staging and <app>-prod),
# __CLUSTER__ (the ECS cluster) and __PROJECT__ (the CodeBuild runner name).
# Inert until the repository variable ECS_DEPLOY_ENABLED is 'true'.
name: PI Deliver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deliver:
    permissions:
      contents: write
      id-token: write
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-deliver.yml@7d9d54ff120d57604971279e0c6c496a035ca291 # v1
    with:
      app: __APP__
      cluster: __CLUSTER__
      runner-build: codebuild-pi-platform-runner-__PROJECT__-${{ github.run_id }}-${{ github.run_attempt }}-arm-3.0-medium
      runner-small: codebuild-pi-platform-runner-__PROJECT__-${{ github.run_id }}-${{ github.run_attempt }}-arm-3.0-small
      # images: '[{"name":"web","dockerfile":"Dockerfile","context":"."}]'
      # services: '["__APP__"]'
      # migrate-command: npm run migrate
