# Palmetto standard checks. Calls the central reusable workflow, which runs on
# the GitHub-hosted ARM runner (ubuntu-24.04-arm). Do not override runner-small:
# the label lives in the central workflow.
# The required status check for main is "pi-checks / pi-checks", so keep the job id.
name: PI Checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pi-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pi-checks:
    permissions:
      contents: read
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-checks.yml@a39c6b8e56e9339ddcbb964409be3dfc3b43e928 # v1
    with:
      stack: node # node | python | go | rust | tofu | docs
