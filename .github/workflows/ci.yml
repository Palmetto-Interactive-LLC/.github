# Dogfoods the central pi-checks workflow on this repository.
name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pi-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/pi-checks.yml
    with:
      stack: docs

  # Runs shipped snippets against fakes: the workflows-match-main check from
  # pi-release.yml (scripts/tests/pi-release-workflows-check.sh) and the
  # rollback-cause message from pi-deliver.yml (pi-deliver-rollback-cause.sh).
  pi-release-tests:
    runs-on: codebuild-pi-actions-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: pi-release workflows check
        run: bash scripts/tests/pi-release-workflows-check.sh

      - name: pi-deliver rollback cause
        run: bash scripts/tests/pi-deliver-rollback-cause.sh
