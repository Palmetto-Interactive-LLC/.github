# Dogfoods the central pi-checks workflow on this repository.
name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pi-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/pi-checks.yml
    with:
      stack: docs
