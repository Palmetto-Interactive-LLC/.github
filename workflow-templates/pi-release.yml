# Palmetto production release. The ONLY way prod changes: run this workflow by
# hand (Actions, Create Release, Run workflow, branch main). It runs the heavy
# gates (full tests, dependency audit, secret history scan, workflow lint,
# release-gate-command), checks the ECR scan of the image staging is running,
# cuts the tag vYYYY.MM.DD.N and the GitHub Release, and deploys that same
# digest to prod with the migration. sha releases an older commit on main
# instead of the head; dry_run stops after the gates and the scan. To roll back
# instead, fill rollback_to and rollback_env.
# Keep the workflow name exactly "Create Release" and the trigger workflow_dispatch only.
# Replace __APP__, __CLUSTER__ and the stack. Mirror the `with:` of pi-deliver.yml.
name: Create Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Optional full commit SHA on main to release. Empty releases the head of main. The commit's already-built staging image is what ships."
        required: false
        default: ""
      requested_by:
        description: "Optional free text: who asked for this release (the Slack release button fills it in)."
        required: false
        default: ""
      dry_run:
        description: "Run only the heavy gates and the ECR scan of the image. No tag, no deploy."
        type: boolean
        default: false
      rollback_to:
        description: "Leave empty to release the head of main. To roll back instead: a release tag (vYYYY.MM.DD.N) or full commit SHA on main."
        required: false
        default: ""
      rollback_env:
        description: "Environment to roll back (used only with rollback_to)."
        type: choice
        options: [staging, prod]
        default: prod

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-release.yml@d7c8077f09cfeffc3cf660081c9499c0911826c5 # v1
    with:
      app: __APP__
      cluster: __CLUSTER__
      stack: node # node | python | go | rust | tofu | docs
      # images: '[{"name":"web","dockerfile":"Dockerfile","context":"."}]'
      # services: '["__APP__"]'
      # migrate-command: npm run migrate
      # test-command: npm test            # the FULL suite; pull requests run quick-test-command only
      # release-gate-command: bash scripts/release-gates.sh
