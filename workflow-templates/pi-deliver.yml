# Palmetto standard delivery for apps on ECS. On merge to main: build the arm64
# image, push it to ECR by full git SHA, deploy staging, wait for it to be stable,
# cut the release tag vYYYY.MM.DD.N, then deploy the same digest to prod.
# Runs on the GitHub-hosted ARM runner (ubuntu-24.04-arm); arm64 images build natively
# with buildx. Do not override the runner inputs: the label lives in the central workflow.
# Replace __APP__ (ECR <app>/web, services <app>-staging and <app>-prod) and
# __CLUSTER__ (the ECS cluster).
# Inert until the repository variable ECS_DEPLOY_ENABLED is 'true'.
name: PI Deliver

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Roll back to this release tag (vYYYY.MM.DD.N) or full commit SHA. Leave empty for a normal delivery of main."
        required: false
        default: ""
      rollback_env:
        description: "Environment to roll back (needed with rollback_to)."
        type: choice
        options: [staging, prod]
        default: staging

permissions: {}

jobs:
  deliver:
    permissions:
      contents: write
      id-token: write
    uses: Palmetto-Interactive-LLC/.github/.github/workflows/pi-deliver.yml@77fe07781ae29fb4439ae26ac00130f6669240ec # v1
    with:
      app: __APP__
      cluster: __CLUSTER__
      # images: '[{"name":"web","dockerfile":"Dockerfile","context":"."}]'
      # services: '["__APP__"]'
      # migrate-command: npm run migrate
