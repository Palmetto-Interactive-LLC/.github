name: AI Review

# Manual only: Actions, AI Review, Run workflow, with the pull request number.
# It no longer runs on every push to a pull request.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review.
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: ai-review
    if: ${{ vars.AI_REVIEW_PROVIDER == 'claude' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Claude PR review
        uses: anthropics/claude-code-action@4633baf5267540f3f8cb58b684f79901d564c280 # v1.0.160
        with:
          # Default path: generated locally with `claude setup-token`, backed by
          # the developer's Claude Pro/Max subscription rather than API-key billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # WIF alternative: remove the token line above, add job permission
          # `id-token: write`, and set anthropic_organization_id plus
          # anthropic_federation_rule_id after configuring federation.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ inputs.pr_number }}"
          claude_args: "--model claude-sonnet-4-6"

      # OpenAI alternative:
      # - uses: openai/codex-action@23cb67af8fc4ecba6f6dd5cdc61e1800176aca61 # v1
      #   with:
      #     openai-api-key: ${{ secrets.OPENAI_API_KEY }}
      #     prompt-file: .github/ai/review-prompt.md
      #     output-file: codex-output.md
      # Then post codex-output.md back to the PR with a SHA-pinned
      # actions/github-script step and pull-requests: write.
