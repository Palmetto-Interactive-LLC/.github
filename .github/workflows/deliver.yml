# Palmetto delivery for ECS apps on GitHub Actions (reusable). Same behavior as
# .depot/workflows/deliver.yml, which stays for the repos still on Depot CI.
# Differences from the Depot copy:
#   - Jobs run on the runner label in the runs-on input (default membl).
#   - AWS auth is GitHub OIDC (id-token: write, aws-actions/configure-aws-credentials).
#     The IAM roles trust token.actions.githubusercontent.com.
#   - The deploy job runs in a GitHub environment (the environment input, default
#     staging, or production in release mode), so the OIDC subject is
#     repo:<owner>/<repo>:environment:<name> and production can require a reviewer.
#   - depot build authenticates with Depot OIDC (trust relationship on the Depot
#     project) or, as a fallback, the optional depot_token secret.
#   - Repo variables are GitHub variables and resolve in the caller, which still
#     passes them as inputs.
#
# Two modes:
#
#   staging (push to main): build the image with depot build (linux/amd64 unless
#     the caller passes platforms, e.g. linux/amd64,linux/arm64), push it
#     to ECR by full git SHA, deploy STAGING, wait for the new revision to be
#     the primary, completed deployment.
#   release (workflow_dispatch on main): build nothing. Require the image for
#     this commit in ECR and staging running that exact digest, gate on ECR's
#     CRITICAL scan, cut the release tag vYYYY.MM.DD.N, then deploy the SAME
#     digest to prod (with the migration).
#   release with digest (rollback): build nothing and cut no tag. The digest
#     must be listed in a published GitHub Release of this repository; any
#     other digest is refused before AWS is touched. Every image comes from
#     that release, the staging check is skipped (staging runs something
#     newer), and the ECR scan gate still runs. The version is that release's
#     tag. Only the services that release deployed are rolled back (its notes
#     list them; a release without the list deployed only <app>). Services
#     added since then keep their current revision.
#
# Prod is reachable only from release, and release runs only on a
# workflow_dispatch from refs/heads/main. Only the head of main is deployed.
#
# Callers pin this file by SHA and grant the job
# `permissions: { contents: write, id-token: write }`.
#   ECS_DEPLOY_ENABLED               "true" turns delivery on
#   PI_PLATFORM_IMAGE_PUSH_ROLE_ARN  OIDC role that pushes this app's ECR repos
#   ECS_DEPLOY_ROLE_ARN              OIDC role that registers task definitions and updates services
#   ECS_SERVING_SECRETS              JSON {"<service>-<env>": ["SECRET_NAME", ...]} the serving revision may hold
name: Deliver

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for every job.
        type: string
        default: membl
      environment:
        description: GitHub environment for the deploy job. Empty means production in release mode and staging otherwise.
        type: string
        default: ""
      app:
        description: App name. ECR repositories are <app>/<image name>; services are <service>-<env>.
        type: string
        required: true
      cluster:
        description: ECS cluster name.
        type: string
        required: true
      images:
        description: JSON list of {name, dockerfile, context[, container][, next-static]}. name is the ECR repository suffix. container defaults to the main container for "web" and to name otherwise. next-static is the .next/static directory inside the image (see static-buckets).
        type: string
        default: '[{"name":"web","dockerfile":"Dockerfile","context":"."}]'
      services:
        description: JSON list of service names. Defaults to [app]. Each runs as <service>-<env>.
        type: string
        default: ""
      platforms:
        description: >-
          Comma-separated depot build platforms. linux/amd64 (default) builds one
          image manifest and pins the revision to X86_64. linux/amd64,linux/arm64
          pushes a multi-arch index and registers the revision without a
          runtimePlatform, so ECS places it on x86_64 or arm64 hosts and each host
          pulls its own architecture.
        type: string
        default: linux/amd64
      container-name:
        description: Main container name (receives the "web" image).
        type: string
        default: web
      has-staging:
        description: false when the app has no staging services. A merge then only builds and pushes the image and a release skips the staging check.
        type: boolean
        default: true
      mode:
        description: staging (default) or release.
        type: string
        default: staging
      digest:
        description: >-
          Release mode only. Roll prod back to this image digest (sha256:<64 hex>).
          It must be listed in a published GitHub Release of this repository;
          anything else is refused. Empty promotes the image of this commit.
        type: string
        default: ""
      migrate-command:
        description: Optional pre-deploy migration, run once per environment as a one-off ECS task. A string runs under "sh -c", a JSON array is the exact command.
        type: string
        default: ""
      migrate-secrets:
        description: 'Optional extra Secrets Manager references for the migration task only: {"<env>": {"ENV_VAR": "<secret name or ARN>"}}.'
        type: string
        default: ""
      deploy-enabled:
        description: 'Pass the ECS_DEPLOY_ENABLED GitHub variable. Delivery runs only when this is "true".'
        type: string
        default: ""
      push-role-arn:
        description: 'Pass the PI_PLATFORM_IMAGE_PUSH_ROLE_ARN GitHub variable. OIDC role that pushes the ECR repositories.'
        type: string
        default: ""
      deploy-role-arn:
        description: 'Fallback only. The deploy job uses the ECS_DEPLOY_ROLE_ARN variable of its GitHub environment when the repo sets one (split deploy roles), else this input. A caller cannot read environment variables, so passing vars.ECS_DEPLOY_ROLE_ARN here gives the repository-level role.'
        type: string
        default: ""
      serving-secrets:
        description: 'Pass the ECS_SERVING_SECRETS GitHub variable. JSON {"<service>-<env>": ["SECRET_NAME", ...]} the serving revision may hold.'
        type: string
        default: "{}"
      stable-timeout-minutes:
        type: number
        default: 15
      scan-allowlist:
        description: 'Path in the caller repo of the ECR scan allowlist {"allow":[{"id","reason","expires"?}]}. A missing file allows nothing.'
        type: string
        default: .github/ecr-scan-allowlist.json
      static-buckets:
        description: >-
          Optional JSON {"<image name>": "<bucket>"}. Each image whose images
          entry has "next-static" (its .next/static directory inside the image)
          publishes those files to s3://<bucket>/_next/static/ before the deploy.
          Pass the NEXT_STATIC_BUCKET_<SERVICE> variables; the push role must be
          allowed to write the bucket.
        type: string
        default: ""
      posthog-project-id:
        description: 'Pass the POSTHOG_PROJECT_ID GitHub variable (optional). With the POSTHOG_ANNOTATION_KEY secret, a prod deploy posts a PostHog annotation.'
        type: string
        default: ""
    secrets:
      incident_io_url:
        description: 'Optional. The INCIDENT_IO_CI_ALERT_URL GitHub secret (incident.io "CI" HTTP alert source URL incl. token). A failed delivery posts a non-paging alert to it.'
        required: false
      depot_token:
        description: 'Optional. A project-scoped Depot token for depot build when no Depot OIDC trust relationship covers the repository.'
        required: false
      POSTHOG_ANNOTATION_KEY:
        description: >-
          Optional PostHog personal API key scoped to annotation:write. When set
          (and the project id is set), a successful prod deploy posts a PostHog
          annotation. Unset: the step is skipped. Callers pass it explicitly.
        required: false

    outputs:
      version:
        description: The release tag (release) or sha-<12>.
        value: ${{ jobs.build.outputs.version }}
      image_digest:
        description: Digest of the first image.
        value: ${{ jobs.build.outputs.image_digest }}

permissions: {}

# One delivery per repository at a time. A running deploy is never cancelled.
concurrency:
  group: deliver-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DEPOT_PROJECT_ID: 3bhs1495zg

jobs:
  # Mode check and head check. A re-run of an old run, or a queued older run,
  # must never roll a service back: only the head of main is delivered.
  guard:
    name: Guard
    # ECS_DEPLOY_ENABLED arrives as an input and is read in a step.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.head.outputs.stale }}
    steps:
      - name: Check the delivery mode
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          if test -n "$DIGEST" && test "$MODE" != "release"; then
            echo "::error::digest (a rollback) is for mode=release only."; exit 1
          fi
          case "$MODE" in
            staging) ;;
            release)
              if test "$GITHUB_EVENT_NAME" != "workflow_dispatch"; then
                echo "::error::mode=release deploys prod and runs only on a workflow_dispatch from refs/heads/main (this is ${GITHUB_EVENT_NAME} on ${GITHUB_REF})."; exit 1
              fi ;;
            *) echo "::error::mode must be staging or release."; exit 1 ;;
          esac

      - name: Skip when this commit is no longer the head of main
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENABLED: ${{ inputs.deploy-enabled }}
        run: |
          set -euo pipefail
          if test "$DEPLOY_ENABLED" != "true"; then
            echo "::notice::ECS_DEPLOY_ENABLED is not true for this repository. Not delivering."
            echo "### Skipped: ECS_DEPLOY_ENABLED is not true" >> "$GITHUB_STEP_SUMMARY"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=""
          for try in 1 2 3 4 5; do
            head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha 2>/dev/null)" && break
            echo "::warning::Reading the head of main failed (attempt ${try}/5)."; sleep $((try * 5))
          done
          test -n "$head" || { echo "::error::Could not read the head of main. Not deploying without it."; exit 1; }
          if test "$head" = "$GITHUB_SHA"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${GITHUB_SHA} is not the head of main (${head}); delivering it would roll a service back. Skipping."
            echo "### Skipped: ${GITHUB_SHA} is not the head of main (${head})" >> "$GITHUB_STEP_SUMMARY"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build image
    needs: guard
    if: needs.guard.outputs.stale == 'false'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    outputs:
      images: ${{ steps.build.outputs.images }}
      version: ${{ steps.version.outputs.version }}
      image_digest: ${{ steps.version.outputs.image_digest }}
      rollback_services: ${{ steps.rollback.outputs.services }}
    env:
      APP: ${{ inputs.app }}
      IMAGES_INPUT: ${{ inputs.images }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      MODE: ${{ inputs.mode }}
      DIGEST: ${{ inputs.digest }}
      SERVICES_INPUT: ${{ inputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Puts the depot CLI on PATH. depot build authenticates with Depot OIDC
      # (id-token: write plus a trust relationship on the Depot project) or the
      # optional depot_token secret.
      - name: Set up Depot
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1

      - name: Validate
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ inputs.push-role-arn }}
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN" || { echo "::error::Pass push-role-arn (the PI_PLATFORM_IMAGE_PUSH_ROLE_ARN GitHub variable)."; exit 1; }
          jq -e 'type == "array" and length > 0 and all(.[]; has("name") and has("dockerfile") and has("context"))' <<<"$IMAGES_INPUT" >/dev/null \
            || { echo "::error::images must be a JSON list of {name, dockerfile, context}."; exit 1; }

      # Rollback only. Runs before any AWS credentials exist: a digest that no
      # published release lists is refused here.
      - name: Resolve the rollback target (a prior release)
        id: rollback
        if: inputs.digest != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # BEGIN rollback-target
          # The digest must be listed in a published (not draft, not prerelease)
          # GitHub Release of this repository. Every image of the app is taken
          # from that one release, so a multi-image app rolls back as a unit.
          # Tested by scripts/tests/pi-deliver-rollback-target.sh.
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::digest must be sha256:<64 hex> (got '${DIGEST}'). Refused."; exit 1; }
          releases="$(gh api --paginate "repos/${SOURCE_REPOSITORY}/releases?per_page=100" | jq -cs 'add // []')"
          match="$(jq -c --arg d "$DIGEST" '[.[] | select((.draft | not) and (.prerelease | not)
              and ((.body // "") | contains("@" + $d + "`")))] | sort_by(.published_at) | last // empty' <<<"$releases")"
          test -n "$match" \
            || { echo "::error::${DIGEST} is not in any published release of ${SOURCE_REPOSITORY}. A rollback deploys only a prior release's digest. Refused."; exit 1; }
          rollback_tag="$(jq -r .tag_name <<<"$match")"
          pins='{}'
          while read -r image; do
            repo="${APP}/$(jq -r .name <<<"$image")"
            pin="$(jq -r .body <<<"$match" | grep -oE "\`${repo}@sha256:[0-9a-f]{64}\`" | head -n 1 | sed -E 's/^.*@(sha256:[0-9a-f]{64}).*$/\1/' || true)"
            test -n "$pin" || { echo "::error::Release ${rollback_tag} lists no digest for ${repo}. Refused."; exit 1; }
            pins="$(jq -c --arg r "$repo" --arg d "$pin" '. + {($r): $d}' <<<"$pins")"
          done < <(jq -c '.[]' <<<"$IMAGES_INPUT")
          # Roll back only what that release deployed: the services its notes
          # list, or <app> alone for a release cut before the notes listed them.
          # A service added since keeps its current revision.
          current="${SERVICES_INPUT:-}"; test -n "$current" || current="$(jq -nc --arg a "$APP" '[$a]')"
          # shellcheck disable=SC2016
          listed="$(jq -r .body <<<"$match" | grep -m1 '^Services: ' | grep -oE '`[^`]+`' | tr -d '`' | jq -Rnc '[inputs]' || true)"
          test -n "$listed" && test "$listed" != "[]" || listed="$(jq -nc --arg a "$APP" '[$a]')"
          services="$(jq -c --argjson l "$listed" '[.[] | select(. as $s | $l | index($s))]' <<<"$current")"
          test "$services" != "[]" \
            || { echo "::error::Release ${rollback_tag} deployed none of the current services ($(jq -c . <<<"$current")). Refused."; exit 1; }
          skipped="$(jq -c --argjson s "$services" '[.[] | select(. as $x | $s | index($x) | not)]' <<<"$current")"
          test "$skipped" = "[]" || echo "::warning::Release ${rollback_tag} did not deploy ${skipped}; they keep their current revision."
          echo "Rollback target: release ${rollback_tag}: $(jq -c . <<<"$pins") to ${services}"
          # END rollback-target
          { echo "tag=${rollback_tag}"; echo "pins=${pins}"; echo "services=${services}"; } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials through GitHub OIDC (image push)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deliver-build-${{ github.run_id }}
          role-to-assume: ${{ inputs.push-role-arn }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          mask-password: true

      - name: Build and push images (skipped when the SHA tag exists)
        id: build
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          MAIN_CONTAINER: ${{ inputs.container-name }}
          PLATFORMS: ${{ inputs.platforms }}
          DEPOT_TOKEN: ${{ secrets.depot_token }}
          PINS: ${{ steps.rollback.outputs.pins }}
          ROLLBACK_TAG: ${{ steps.rollback.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$PLATFORMS" =~ ^linux/(amd64|arm64)(,linux/(amd64|arm64))?$ ]] \
            || { echo "::error::platforms must be linux/amd64, linux/arm64 or both (got '${PLATFORMS}')."; exit 1; }
          result='[]'
          while read -r image; do
            name="$(jq -r .name <<<"$image")"
            dockerfile="$(jq -r .dockerfile <<<"$image")"
            context="$(jq -r .context <<<"$image")"
            container="$(jq -r --arg main "$MAIN_CONTAINER" '.container // (if .name == "web" then $main else .name end)' <<<"$image")"
            repo="${APP}/${name}"
            uri="${REGISTRY}/${repo}:${SOURCE_SHA}"

            if test -n "$DIGEST"; then
              # Rollback: the release's digest, which must still be in ECR.
              digest="$(jq -r --arg r "$repo" '.[$r] // empty' <<<"$PINS")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No rollback digest resolved for ${repo}."; exit 1; }
              aws ecr describe-images --repository-name "$repo" --image-ids "imageDigest=${digest}" >/dev/null \
                || { echo "::error::${repo}@${digest} (release ${ROLLBACK_TAG}) is no longer in ECR."; exit 1; }
              uri="${REGISTRY}/${repo}@${digest}"
              echo "Rollback: ${repo}@${digest} from release ${ROLLBACK_TAG}"
            else
            err="$(mktemp)"
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=${SOURCE_SHA}" >/dev/null 2>"$err"; then
              echo "::notice::${repo}:${SOURCE_SHA} already exists in ECR; reusing it."
            elif grep -q ImageNotFoundException "$err"; then
              if test "$MODE" != "staging"; then
                echo "::error::${repo}:${SOURCE_SHA} is not in ECR. A release never builds: let the staging deploy of this commit finish first."; exit 1
              fi
              echo "::group::Build ${repo} (${PLATFORMS})"
              # No attestations: one platform gives one plain image manifest, two
              # give an index holding only the two platform manifests. The digest
              # promoted to prod is that manifest or index.
              # Depot's OIDC sign-in sometimes fails with "missing API token" before the
              # build starts. Retry that once; any other failure stops here.
              build_log="$(mktemp)"
              for attempt in 1 2; do
                if depot build --project "$DEPOT_PROJECT_ID" --platform "$PLATFORMS" --provenance=false --sbom=false \
                  --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
                  --label "org.opencontainers.image.source=https://github.com/${SOURCE_REPOSITORY}" \
                  --file "$dockerfile" --tag "$uri" --push "$context" 2>&1 | tee "$build_log"; then
                  break
                fi
                if test "$attempt" = 1 && grep -q 'missing API token' "$build_log"; then
                  echo "::warning::Depot sign-in failed with 'missing API token'; retrying once."
                  sleep 15
                  continue
                fi
                exit 1
              done
              rm -f "$build_log"
              echo "::endgroup::"
            else
              cat "$err"; echo "::error::Could not check ECR for ${repo}:${SOURCE_SHA}."; exit 1
            fi
            rm -f "$err"
            fi

            # Read the architecture(s) back from ECR. The deploy job writes the
            # task definition's runtimePlatform from them, so a revision always
            # matches its image. An index inspects as a map of platform -> image;
            # arch is "amd64", "arm64" or "amd64,arm64".
            arch="$(docker buildx imagetools inspect "$uri" --format '{{json .Image}}' \
              | jq -r 'if has("architecture") then [.architecture] else [.[].architecture] end
                       | map(select(. != null and . != "unknown")) | unique | join(",")')"
            case "$arch" in
              amd64|arm64|amd64,arm64) echo "${repo}:${SOURCE_SHA} is linux/${arch}" ;;
              *) echo "::error::${repo}:${SOURCE_SHA} has architecture '${arch:-unknown}', not amd64, arm64 or both."; exit 1 ;;
            esac
            want="$(tr ',' '\n' <<<"$PLATFORMS" | sed 's|^linux/||' | sort -u | paste -sd, -)"
            test "$arch" = "$want" || echo "::warning::${repo}:${SOURCE_SHA} is linux/${arch}, not ${want} (pushed before platforms changed). Its revision follows the image."

            if test -z "$DIGEST"; then
              digest="$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=${SOURCE_SHA}" \
                --query 'imageDetails[0].imageDigest' --output text)"
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::ECR returned no valid digest for ${repo}."; exit 1; }
            result="$(jq -c --arg name "$name" --arg repo "$repo" --arg container "$container" \
              --arg ref "${REGISTRY}/${repo}@${digest}" --arg digest "$digest" --arg arch "$arch" \
              '. + [{name:$name, repo:$repo, container:$container, ref:$ref, digest:$digest, arch:$arch}]' <<<"$result")"
          done < <(jq -c '.[]' <<<"$IMAGES_INPUT")
          # One task definition holds every image of a build, so they share an architecture.
          test "$(jq -r '[.[].arch] | unique | length' <<<"$result")" = 1 \
            || { echo "::error::The images of one build have different architectures: $(jq -c '[.[] | {repo, arch}]' <<<"$result")"; exit 1; }
          echo "images=${result}" >> "$GITHUB_OUTPUT"

      # Release only. Runs before anything is deployed: a CRITICAL finding the
      # allowlist does not accept stops the release. An image reused from an
      # earlier run keeps the scan from its first push.
      - name: Gate on the ECR image scan (fail on CRITICAL findings)
        if: env.MODE == 'release'
        shell: bash
        env:
          BUILT: ${{ steps.build.outputs.images }}
          ALLOWLIST: ${{ inputs.scan-allowlist }}
        run: |
          set -euo pipefail
          allowed='[]'
          if test -f "$ALLOWLIST"; then
            allowed="$(jq -c --arg today "$(date -u +%F)" '[.allow[] | select((.expires // "9999-12-31") >= $today) | .id]' "$ALLOWLIST")"
          fi
          blocked=0
          while read -r image; do
            repo="$(jq -r .repo <<<"$image")"; index="$(jq -r .digest <<<"$image")"
            # ECR scans platform manifests, not a multi-arch index: gate each one.
            children="$(aws ecr batch-get-image --repository-name "$repo" --image-ids "imageDigest=${index}" \
              --accepted-media-types application/vnd.oci.image.index.v1+json application/vnd.docker.distribution.manifest.list.v2+json \
                application/vnd.oci.image.manifest.v1+json application/vnd.docker.distribution.manifest.v2+json \
              --query 'images[0].imageManifest' --output text \
              | jq -r '[.manifests[]? | select((.platform.architecture // "unknown") != "unknown") | .digest] | join(" ")')"
            for digest in ${children:-$index}; do
            status=NOT_STARTED
            for _ in $(seq 60); do
              if scan="$(aws ecr describe-image-scan-findings --repository-name "$repo" --image-id "imageDigest=${digest}" --output json 2>/dev/null)"; then
                status="$(jq -r '.imageScanStatus.status // "UNKNOWN"' <<<"$scan")"
              else
                status=NOT_STARTED
              fi
              case "$status" in COMPLETE|ACTIVE|UNSUPPORTED_IMAGE|FAILED) break ;; esac
              sleep 10
            done
            case "$status" in
              COMPLETE|ACTIVE) ;;
              UNSUPPORTED_IMAGE) echo "::warning::${repo}@${digest}: ECR cannot scan this image. Not gated."; continue ;;
              *) echo "::error::${repo}@${digest}: ECR scan status ${status} after 10 minutes. Is scan on push enabled?"; exit 1 ;;
            esac
            open="$(jq -c --argjson allowed "$allowed" '
                [ (.imageScanFindings.findings // [])[] | select(.severity == "CRITICAL") | .name ]
                + [ (.imageScanFindings.enhancedFindings // [])[] | select(.severity == "CRITICAL")
                    | (.packageVulnerabilityDetails.vulnerabilityId // .title) ]
                | unique | map(select(. as $id | $allowed | any(. == $id) | not))' <<<"$scan")"
            echo "${repo}@${digest}: $(jq -r '(.imageScanFindings.findingSeverityCounts // {}) | to_entries | map("\(.key) \(.value)") | join(", ")' <<<"$scan")"
            if test "$(jq length <<<"$open")" -gt 0; then
              echo "::error::${repo}: CRITICAL findings not allowlisted: $(jq -r 'join(", ")' <<<"$open"). Fix the image, or allowlist them with a reason."
              blocked=1
            fi
            done
          done < <(jq -c '.[]' <<<"$BUILT")
          test "$blocked" -eq 0 || { echo "::error::CRITICAL image findings block this release. Nothing was deployed."; exit 1; }

      # Opt-in (static-buckets). Copies each image's Next.js hashed assets (the
      # image's "next-static" directory) to s3://<bucket>/_next/static/ before
      # anything deploys, so new HTML never points at an asset the CDN lacks.
      # No --delete: pages still served by the previous revision keep theirs.
      - name: Publish Next.js static assets
        if: inputs.static-buckets != ''
        shell: bash
        env:
          BUILT: ${{ steps.build.outputs.images }}
          STATIC_BUCKETS: ${{ inputs.static-buckets }}
        run: |
          set -euo pipefail
          # BEGIN next-static
          jq -e 'type == "object" and all(.[]; type == "string")' <<<"$STATIC_BUCKETS" >/dev/null \
            || { echo "::error::static-buckets must be a JSON object {\"<image name>\": \"<bucket>\"}."; exit 1; }
          cache="public, max-age=31536000, immutable"
          # Types set explicitly; anything else keeps the CLI's guess.
          types="css=text/css js=text/javascript mjs=text/javascript map=application/json json=application/json woff2=font/woff2 woff=font/woff svg=image/svg+xml txt=text/plain"
          while read -r image; do
            name="$(jq -r .name <<<"$image")"
            src="$(jq -r '."next-static" // empty' <<<"$image")"
            test -n "$src" || continue
            bucket="$(jq -r --arg n "$name" '.[$n] // empty' <<<"$STATIC_BUCKETS")"
            if test -z "$bucket"; then
              echo "::warning::${name}: next-static is set but static-buckets has no bucket for it. Not published."; continue
            fi
            ref="$(jq -r --arg n "$name" 'map(select(.name == $n))[0].ref // empty' <<<"$BUILT")"
            arch="$(jq -r --arg n "$name" 'map(select(.name == $n))[0].arch // "amd64" | split(",")[0]' <<<"$BUILT")"
            test -n "$ref" || { echo "::error::${name}: no image in this build."; exit 1; }
            dir="$(mktemp -d)"
            docker pull -q --platform "linux/${arch}" "$ref" >/dev/null
            id="$(docker create --platform "linux/${arch}" "$ref")"
            docker cp "${id}:${src%/}/." "$dir/"
            docker rm -f "$id" >/dev/null
            count="$(find "$dir" -type f | wc -l | tr -d ' ')"
            test "$count" -gt 0 || { echo "::error::${name}: ${src} is empty or missing in ${ref}."; exit 1; }
            dest="s3://${bucket}/_next/static/"
            rest=()
            for pair in $types; do
              ext="${pair%%=*}"; rest+=(--exclude "*.${ext}")
              aws s3 sync "$dir" "$dest" --only-show-errors --exclude '*' --include "*.${ext}" \
                --content-type "${pair#*=}" --cache-control "$cache"
            done
            aws s3 sync "$dir" "$dest" --only-show-errors "${rest[@]}" --cache-control "$cache"
            echo "${name}: ${count} files from ${src} in s3://${bucket}/_next/static/"
            rm -rf "$dir"
          done < <(jq -c '.[]' <<<"$IMAGES_INPUT")
          # END next-static

      - name: Choose the version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ steps.build.outputs.images }}
          ROLLBACK_TAG: ${{ steps.rollback.outputs.tag }}
        run: |
          set -euo pipefail
          # Staging deploys are not releases: SENTRY_RELEASE is the commit.
          if test "$MODE" = "staging"; then
            version="sha-${SOURCE_SHA:0:12}"
          elif test -n "$ROLLBACK_TAG"; then
            # A rollback redeploys a prior release under its own tag.
            version="$ROLLBACK_TAG"
          else
            # A re-run of the same commit keeps the tag it already has.
            version="$(gh api "repos/${SOURCE_REPOSITORY}/tags?per_page=100" | jq -r --arg sha "$GITHUB_SHA" \
              '[.[] | select(.commit.sha == $sha and (.name | test("^v[0-9]{4}[.][0-9]{2}[.][0-9]{2}[.][0-9]+$")))][0].name // empty')"
            if test -z "$version"; then
              prefix="v$(date -u +%Y.%m.%d)."
              last="$(gh api "repos/${SOURCE_REPOSITORY}/git/matching-refs/tags/${prefix}" | jq -r --arg p "refs/tags/${prefix}" \
                '[.[].ref | ltrimstr($p) | select(test("^[0-9]+$")) | tonumber] | max // 0')"
              version="${prefix}$((last + 1))"
            fi
          fi
          echo "Version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_digest=$(jq -r '.[0].digest // empty' <<<"$BUILT")" >> "$GITHUB_OUTPUT"

  # Release only: the tag and GitHub Release, cut after the gates and before
  # prod is touched.
  release:
    name: Cut release
    needs: build
    # A rollback cuts no tag: it redeploys a prior release.
    if: inputs.mode == 'release' && inputs.digest == ''
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      IMAGES: ${{ needs.build.outputs.images }}
      APP: ${{ inputs.app }}
      SERVICES_INPUT: ${{ inputs.services }}
    steps:
      - name: Cut the release (tag and GitHub Release)
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq .sha >"$RUNNER_TEMP/tagged" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/tagged")" = "$GITHUB_SHA" \
              || { echo "::error::Tag ${VERSION} points at $(cat "$RUNNER_TEMP/tagged"), not ${GITHUB_SHA}."; exit 1; }
            echo "Tag ${VERSION} already points at ${GITHUB_SHA}."
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists."
          else
            notes="$(jq -r '"Images (linux/\(.[0].arch // "amd64")), deployed by digest:\n" + ([.[] | "- `\(.repo)@\(.digest)`"] | join("\n"))' <<<"$IMAGES")"
            # A rollback to this release redeploys exactly these services.
            services="${SERVICES_INPUT:-}"; test -n "$services" || services="$(jq -nc --arg a "$APP" '[$a]')"
            notes="${notes}"$'\n\n'"Services: $(jq -r 'map("`" + . + "`") | join(", ")' <<<"$services")"
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" \
              --generate-notes --notes "$notes"
          fi

  deploy:
    name: Deploy ${{ inputs.mode == 'release' && 'prod' || 'staging' }}
    needs: [build, release]
    # release is skipped outside release mode; a failed release stops prod.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (inputs.has-staging || inputs.mode == 'release') }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    environment: ${{ inputs.environment != '' && inputs.environment || (inputs.mode == 'release' && 'production' || 'staging') }}
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ inputs.mode }}
      KIND: ${{ inputs.digest != '' && 'rollback' || inputs.mode }}
      APP: ${{ inputs.app }}
      CLUSTER: ${{ inputs.cluster }}
      DEPLOY_ENV: ${{ inputs.mode == 'release' && 'prod' || 'staging' }}
      # A rollback deploys only the services its release deployed.
      SERVICES_INPUT: ${{ needs.build.outputs.rollback_services || inputs.services }}
      IMAGES: ${{ needs.build.outputs.images }}
      VERSION: ${{ needs.build.outputs.version }}
      MIGRATE_COMMAND: ${{ inputs.migrate-command }}
      MIGRATE_SECRETS: ${{ inputs.migrate-secrets }}
      MAIN_CONTAINER: ${{ inputs.container-name }}
      STABLE_MINUTES: ${{ inputs.stable-timeout-minutes }}
      # Service name -> the secret names it may serve with, set per repo. The
      # secret guard fails a revision with any other secret.
      SERVING_SECRETS: ${{ inputs.serving-secrets }}
    steps:
      # The environment-scoped ECS_DEPLOY_ROLE_ARN (pi-platform split deploy roles:
      # one role per environment, trusting only environment:<name>) wins over the
      # input, which the caller resolves at repository level.
      - name: Require a deploy role
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.ECS_DEPLOY_ROLE_ARN || inputs.deploy-role-arn }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "::error::Set the ECS_DEPLOY_ROLE_ARN variable on this GitHub environment, or pass deploy-role-arn."; exit 1; }
          echo "Deploy role: ${AWS_ROLE_ARN##*/}"

      - name: Configure AWS credentials through GitHub OIDC (ECS deploy)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deliver-${{ inputs.mode }}-${{ github.run_id }}
          role-to-assume: ${{ vars.ECS_DEPLOY_ROLE_ARN || inputs.deploy-role-arn }}

      # A release promotes what staging already runs. If staging is on another
      # digest (a newer merge, a failed staging deploy), stop: the scan ran on
      # an image nobody has exercised. A rollback skips this: its image already
      # served prod as a prior release, and staging runs something newer.
      - name: Require staging to run this exact image
        if: env.MODE == 'release' && inputs.has-staging && inputs.digest == ''
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$SERVICES_INPUT"; then services="$SERVICES_INPUT"; else services="$(jq -nc --arg a "$APP" '[$a]')"; fi
          for svc in $(jq -r '.[]' <<<"$services"); do
            td="$(aws ecs describe-services --cluster "$CLUSTER" --services "${svc}-staging" --query 'services[0].taskDefinition' --output text)"
            running="$(aws ecs describe-task-definition --task-definition "$td" --query 'taskDefinition.containerDefinitions[].image' --output text | tr '\t' '\n')"
            while read -r digest; do
              grep -q "@${digest}$" <<<"$running" \
                || { echo "::error::${svc}-staging is not running image digest ${digest}. Merge to main deploys staging first; wait for that deploy to finish, then release."; exit 1; }
            done < <(jq -r '.[].digest' <<<"$IMAGES")
          done
          echo "Staging runs the digest(s) being released."

      - name: Register task definitions with the new image
        id: register
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$SERVICES_INPUT"; then services="$SERVICES_INPUT"; else services="$(jq -nc --arg a "$APP" '[$a]')"; fi
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<<"$services" >/dev/null \
            || { echo "::error::services must be a JSON list of names."; exit 1; }
          workdir="$RUNNER_TEMP/taskdefs"; mkdir -p "$workdir"
          deploy='[]'
          for svc in $(jq -r '.[]' <<<"$services"); do
            family="${svc}-${DEPLOY_ENV}"
            # BEGIN live-revision
            # Copy the revision the service runs, never the family's newest
            # revision. The newest can be a migration-only or one-off revision
            # (DATABASE_MIGRATOR_URL, a one-off token), and copying it would put
            # that secret into the serving container (2026-10-30).
            # Tested by scripts/tests/pi-deliver-secret-guard.sh.
            # shellcheck disable=SC2016
            base="$(aws ecs describe-services --cluster "$CLUSTER" --services "$family" \
              --query 'services[?status==`ACTIVE`] | [0].taskDefinition' --output text)"
            case "$base" in
              arn:aws:ecs:*:task-definition/"$family":*) echo "Base revision for ${family}: ${base##*/} (the service's live revision)" ;;
              *) echo "::error::Could not read the live task definition of service ${family} (got '${base}'). Not deploying from a guess."; exit 1 ;;
            esac
            # END live-revision
            aws ecs describe-task-definition --task-definition "$base" --query taskDefinition --output json \
              | jq --argjson imgs "$IMAGES" --arg rel "$VERSION" '
                  del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)
                  | .containerDefinitions |= map(
                      . as $c
                      | ([ $imgs[] | select(.container == $c.name
                            or .repo == ($c.image | sub("^[^/]+/"; "") | sub("[:@].*$"; ""))) ][0]) as $m
                      | if $m == null then .
                        else .image = $m.ref
                          | .environment = (((.environment // []) | map(select(.name != "SENTRY_RELEASE")))
                                            + [{name: "SENTRY_RELEASE", value: $rel}])
                        end)' > "$workdir/${family}.json"
            swapped="$(jq --argjson imgs "$IMAGES" '[.containerDefinitions[] | select(.image as $i | $imgs | any(.ref == $i))] | length' "$workdir/${family}.json")"
            # BEGIN runtime-platform
            # The revision's CPU architecture follows its image, not the copied
            # live revision: ECS places an X86_64 revision only on x86_64 hosts
            # and an ARM64 one only on arm64 hosts. A multi-arch image (amd64 and
            # arm64) gets no runtimePlatform: the EC2 task places on either kind
            # of host and each pulls its own architecture from the index. Tested
            # by scripts/tests/pi-deliver-runtime-platform.sh.
            img_arch="$(jq -r '.[0].arch // ""' <<<"$IMAGES")"
            if test "$img_arch" = "amd64,arm64"; then
              rp_filter='del(.runtimePlatform)'
              cpu_arch="any (multi-arch image)"
            else
              cpu_arch="$(jq -rn --arg a "$img_arch" '{amd64: "X86_64", arm64: "ARM64"}[$a] // empty')"
              test -n "$cpu_arch" || { echo "::error::No known architecture on the images of this build ($(jq -c '[.[].arch]' <<<"$IMAGES"))."; exit 1; }
              # shellcheck disable=SC2016 # $a is a jq variable
              rp_filter='.runtimePlatform = {cpuArchitecture: $a, operatingSystemFamily: "LINUX"}'
            fi
            jq --arg a "$cpu_arch" "$rp_filter" "$workdir/${family}.json" > "$workdir/${family}.rp.json"
            mv "$workdir/${family}.rp.json" "$workdir/${family}.json"
            echo "Runtime platform for ${family}: ${cpu_arch}"
            # END runtime-platform
            test "$swapped" -gt 0 || { echo "::error::No container in ${family} matched an image in this build (containers: $(jq -r '[.containerDefinitions[].name] | join(", ")' "$workdir/${family}.json"))."; exit 1; }
            # BEGIN secret-guard
            # A serving revision may hold only the secrets pi-platform declares
            # for this service (ECS_SERVING_SECRETS), and never a migrator one.
            # Tested by scripts/tests/pi-deliver-secret-guard.sh.
            names="$(jq -r '[.containerDefinitions[].secrets[]?.name] | unique | .[]' "$workdir/${family}.json")"
            migrator="$(grep -E '(^|_)MIGRATOR(_|$)' <<<"$names" | paste -sd, - || true)"
            if test -n "$migrator"; then
              echo "::error::${family}: the serving revision would carry ${migrator}. Migrator secrets belong only in the migration-only revision. Move the service to a revision without them, then deploy again."
              exit 1
            fi
            if test -n "${SERVING_SECRETS:-}"; then
              declared="$(jq -r --arg f "$family" 'if has($f) then .[$f][] else "<undeclared-service>" end' <<<"$SERVING_SECRETS")"
              if grep -qx '<undeclared-service>' <<<"$declared"; then
                echo "::error::${family} is not in ECS_SERVING_SECRETS. pi-platform declares the secrets of every service it deploys."
                exit 1
              fi
              extra="$(comm -23 <(grep -v '^$' <<<"$names" | sort -u) <(grep -v '^$' <<<"$declared" | sort -u) | paste -sd, - || true)"
              if test -n "$extra"; then
                echo "::error::${family}: the serving revision would carry secrets pi-platform does not declare for it: ${extra}. Declare them in pi-platform, or move the service to a revision without them."
                exit 1
              fi
              echo "Secret guard: ${family} serves only declared secrets ($(grep -c . <<<"$names" || true))."
            else
              echo "::warning::ECS_SERVING_SECRETS is not set in this repository, so only the migrator check ran for ${family}."
            fi
            # END secret-guard
            arn="$(aws ecs register-task-definition --cli-input-json "file://$workdir/${family}.json" \
              --query taskDefinition.taskDefinitionArn --output text)"
            echo "Registered ${arn} (${swapped} container image(s) updated)"
            deploy="$(jq -c --arg family "$family" --arg arn "$arn" '. + [{family:$family, arn:$arn}]' <<<"$deploy")"
          done
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"

      - name: Run pre-deploy migration
        if: inputs.migrate-command != ''
        shell: bash
        env:
          DEPLOY: ${{ steps.register.outputs.deploy }}
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/taskdefs"
          family="$(jq -r '.[0].family' <<<"$DEPLOY")"
          arn="$(jq -r '.[0].arn' <<<"$DEPLOY")"

          # Optional migration-only Secrets Manager references, as a separate
          # revision of the same family. The services keep the first revision.
          # That revision is deregistered when this step ends, whatever the
          # outcome, so it can never be copied or run again (2026-10-30).
          migrate_rev=""
          cleanup() {
            if test -n "$migrate_rev"; then
              aws ecs deregister-task-definition --task-definition "$migrate_rev" >/dev/null \
                && echo "Deregistered migration-only revision ${migrate_rev##*/}" \
                || echo "::warning::Could not deregister ${migrate_rev##*/}; do it by hand."
            fi
          }
          trap cleanup EXIT
          extra="$(jq -c --arg env "$DEPLOY_ENV" 'if . == null then {} elif all(.[]; type == "string") then . else (.[$env] // {}) end' <<<"${MIGRATE_SECRETS:-null}")"
          if test "$extra" != "{}" && test "$extra" != "null"; then
            jq --arg main "$MAIN_CONTAINER" --argjson extra "$extra" '
                .containerDefinitions |= map(
                  if .name == $main then
                    .secrets = (((.secrets // []) | map(select(.name as $n | $extra | has($n) | not)))
                                + ($extra | to_entries | map({name: .key, valueFrom: .value})))
                  else . end)' "$workdir/${family}.json" > "$workdir/${family}-migrate.json"
            arn="$(aws ecs register-task-definition --cli-input-json "file://$workdir/${family}-migrate.json" \
              --query taskDefinition.taskDefinitionArn --output text)"
            migrate_rev="$arn"
            echo "Registered migration-only revision ${arn}"
          fi

          if jq -e 'type == "array"' <<<"$MIGRATE_COMMAND" >/dev/null 2>&1; then
            command="$MIGRATE_COMMAND"
          else
            command="$(jq -nc --arg c "$MIGRATE_COMMAND" '["sh","-c",$c]')"
          fi
          overrides="$(jq -nc --arg name "$MAIN_CONTAINER" --argjson cmd "$command" '{containerOverrides: [{name: $name, command: $cmd}]}')"

          # Reuse the service's own placement so the task lands on the same EC2 capacity.
          strategy="$(aws ecs describe-services --cluster "$CLUSTER" --services "$family" \
            --query 'services[0].capacityProviderStrategy' --output json)"
          if test "$(jq 'length' <<<"${strategy:-[]}" 2>/dev/null || echo 0)" -gt 0; then
            placement=(--capacity-provider-strategy "$strategy")
          else
            placement=(--launch-type EC2)
          fi
          # BEGIN awsvpc-network
          # An awsvpc revision (ECS Managed Instances, PAL-1281) needs the service's own
          # subnets and security groups; a bridge revision takes none. Tested by
          # scripts/tests/pi-deliver-awsvpc-network.sh.
          network=()
          if test "$(jq -r '.networkMode // "bridge"' "$workdir/${family}.json")" = "awsvpc"; then
            netcfg="$(aws ecs describe-services --cluster "$CLUSTER" --services "$family" \
              --query 'services[0].networkConfiguration' --output json)"
            if test -z "$netcfg" || test "$netcfg" = "null"; then
              echo "::error::${family} is awsvpc but its service has no networkConfiguration to run the migration with."
              exit 1
            fi
            network=(--network-configuration "$netcfg")
          fi
          # END awsvpc-network

          run="$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$arn" --count 1 \
            --started-by "deliver-${GITHUB_RUN_ID}" --overrides "$overrides" "${placement[@]}" ${network[@]+"${network[@]}"} --output json)"
          task="$(jq -r '.tasks[0].taskArn // empty' <<<"$run")"
          test -n "$task" || { echo "::error::Migration task did not start: $(jq -c '.failures' <<<"$run")"; exit 1; }
          echo "Migration task started: ${task##*/}"

          deadline=$((SECONDS + 1200))
          while :; do
            desc="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --output json)"
            test "$(jq -r '.tasks[0].lastStatus' <<<"$desc")" = "STOPPED" && break
            if test "$SECONDS" -ge "$deadline"; then
              aws ecs stop-task --cluster "$CLUSTER" --task "$task" --reason "deliver migration timeout" >/dev/null || true
              echo "::error::Migration did not finish within 20 minutes."
              exit 1
            fi
            sleep 10
          done
          code="$(jq -r --arg name "$MAIN_CONTAINER" '.tasks[0].containers[] | select(.name == $name) | .exitCode // "none"' <<<"$desc")"
          reason="$(jq -r '.tasks[0].stoppedReason // ""' <<<"$desc")"
          group="$(jq -r --arg name "$MAIN_CONTAINER" '.containerDefinitions[] | select(.name == $name) | .logConfiguration.options["awslogs-group"] // ""' "$workdir/${family}.json")"
          echo "Migration exit code: ${code} (${reason}). Logs: ${group:-n/a} (stream prefix ecs/${MAIN_CONTAINER}/${task##*/})"
          test "$code" = "0" || { echo "::error::Migration failed with exit code ${code}. ${reason}"; exit 1; }

      - name: Roll services and wait for a stable deployment
        shell: bash
        env:
          DEPLOY: ${{ steps.register.outputs.deploy }}
        run: |
          set -euo pipefail
          while read -r item; do
            family="$(jq -r .family <<<"$item")"
            arn="$(jq -r .arn <<<"$item")"
            # Staging sleeps at 0 tasks (pi-platform's staging-sleeper). A deploy
            # wakes it to at least one task, or the roll below would pass on 0/0
            # without the new image ever starting. Tested by
            # scripts/tests/pi-deliver-staging-wake.sh.
            # BEGIN staging-wake
            count=()
            if test "$DEPLOY_ENV" = "staging"; then
              desired="$(aws ecs describe-services --cluster "$CLUSTER" --services "$family" --query 'services[0].desiredCount' --output text)"
              if test "$desired" = "0"; then
                count=(--desired-count 1)
                echo "${family} is asleep (0 tasks); waking it to 1."
              fi
            fi
            # END staging-wake
            aws ecs update-service --cluster "$CLUSTER" --service "$family" --task-definition "$arn" ${count[@]+"${count[@]}"} >/dev/null
            echo "Updated ${family} -> ${arn##*/}"
          done < <(jq -c '.[]' <<<"$DEPLOY")

          # The gate is the PRIMARY deployment of the revision we just registered
          # reaching COMPLETED. aws ecs wait services-stable is not enough: after a
          # circuit-breaker rollback the service is "stable" on the old revision.
          deadline=$((SECONDS + STABLE_MINUTES * 60))
          while read -r item; do
            family="$(jq -r .family <<<"$item")"
            arn="$(jq -r .arn <<<"$item")"
            while :; do
              svc="$(aws ecs describe-services --cluster "$CLUSTER" --services "$family" --output json | jq -c '.services[0]')"
              failed="$(jq -r --arg arn "$arn" '[.deployments[] | select(.taskDefinition == $arn and .rolloutState == "FAILED")] | length' <<<"$svc")"
              if test "$failed" -gt 0; then
                jq -r '.events[0:8][] | "  \(.createdAt) \(.message)"' <<<"$svc"
                # BEGIN rollback-cause
                # Say what failed the deployment: a deploy-gate alarm (the new
                # tasks served 5xx or logged errors) or the circuit breaker (they
                # failed to start or failed their health checks). ECS rolled back.
                # Tested by scripts/tests/pi-deliver-rollback-cause.sh.
                reason="$(jq -r --arg arn "$arn" '[.deployments[] | select(.taskDefinition == $arn and .rolloutState == "FAILED")][0].rolloutStateReason // ""' <<<"$svc")"
                case "$reason" in
                  *[Aa]larm*) cause="a deployment alarm went to ALARM, so the new tasks served 5xx or logged errors (gates: $(jq -r '(.deploymentConfiguration.alarms.alarmNames // []) | join(", ")' <<<"$svc"))" ;;
                  *"circuit breaker"*) cause="the circuit breaker stopped it: the new tasks failed to start or failed their health checks" ;;
                  *) cause="ECS failed the deployment" ;;
                esac
                echo "::error::${family} deployment of ${arn##*/} failed and ECS rolled it back: ${cause}. ECS: ${reason:-no reason given}"
                # END rollback-cause
                exit 1
              fi
              ok="$(jq -r --arg arn "$arn" '
                  (.deployments | length) == 1
                  and .deployments[0].taskDefinition == $arn
                  and .deployments[0].status == "PRIMARY"
                  and ((.deployments[0].rolloutState // "COMPLETED") == "COMPLETED")
                  and .runningCount == .desiredCount
                  and .desiredCount >= 1' <<<"$svc")"
              if test "$ok" = "true"; then
                echo "${family} is stable on ${arn##*/} ($(jq -r .runningCount <<<"$svc") running)."
                break
              fi
              if test "$SECONDS" -ge "$deadline"; then
                jq -r '.events[0:8][] | "  \(.createdAt) \(.message)"' <<<"$svc"
                echo "::error::${family} did not become stable within ${STABLE_MINUTES} minutes."
                exit 1
              fi
              sleep 5
            done
          done < <(jq -c '.[]' <<<"$DEPLOY")

      # Optional: mark the prod deploy on PostHog charts. Skipped unless both the
      # project id and the annotation key are set. Never fails the deploy.
      - name: Annotate the deploy in PostHog
        if: ${{ success() && env.DEPLOY_ENV == 'prod' }}
        continue-on-error: true
        shell: bash
        env:
          POSTHOG_PROJECT_ID: ${{ inputs.posthog-project-id }}
          POSTHOG_ANNOTATION_KEY: ${{ secrets.POSTHOG_ANNOTATION_KEY }}
          POSTHOG_HOST: https://us.posthog.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if test -z "${POSTHOG_PROJECT_ID:-}" || test -z "${POSTHOG_ANNOTATION_KEY:-}"; then
            echo "PostHog annotation skipped (POSTHOG_PROJECT_ID or POSTHOG_ANNOTATION_KEY not set)."; exit 0
          fi
          body="$(jq -nc --arg app "$APP" --arg version "$VERSION" --arg sha "$GITHUB_SHA" --arg mode "$KIND" --arg run "$RUN_URL" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{content: ((if $mode == "rollback" then "Rollback " else "Deploy " end) + $app + " " + $version + " to prod (" + $sha[0:12] + ") " + $run), date_marker: $at, scope: "project"}')"
          code="$(curl -sS -o "$RUNNER_TEMP/posthog-annotation.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${POSTHOG_ANNOTATION_KEY}" -H 'Content-Type: application/json' \
            --data "$body" "${POSTHOG_HOST}/api/projects/${POSTHOG_PROJECT_ID}/annotations/")" || code=000
          if test "$code" = "201"; then echo "PostHog annotation created (project ${POSTHOG_PROJECT_ID})."
          else echo "::warning::PostHog annotation failed (HTTP ${code}): $(head -c 200 "$RUNNER_TEMP/posthog-annotation.json" 2>/dev/null || true)"; fi

      - name: Job summary
        if: always()
        shell: bash
        env:
          DEPLOY: ${{ steps.register.outputs.deploy }}
        run: |
          {
            echo "### Deploy ${DEPLOY_ENV}$(test "$KIND" = rollback && echo ' (rollback)')"
            echo
            echo "- Version: \`${VERSION}\` (\`${GITHUB_SHA}\`)"
            jq -r '.[] | "- Image: `\(.repo)@\(.digest)` (linux/\(.arch // "unknown"))"' <<<"$IMAGES"
            if test -n "$DEPLOY"; then jq -r '.[] | "- Task definition: `\(.arn | split("/")[-1])`"' <<<"$DEPLOY"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Non-paging alert to incident.io (the "CI" HTTP alert source) when any
  # delivery job failed. A skipped delivery (stale head, disabled) is not a failure.
  alert:
    name: Alert on failure
    needs: [guard, build, release, deploy]
    if: failure()
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post to incident.io
        shell: bash
        env:
          ALERT_URL: ${{ secrets.incident_io_url }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          # BEGIN alert-post
          if test -z "$ALERT_URL"; then
            echo "::notice::No incident_io_url secret passed. Not alerting."; exit 0
          fi
          echo "::add-mask::$ALERT_URL"
          # The URL's token and source id are secret on their own, and an error
          # response could echo them, so they are masked and scrubbed as well.
          url_path="${ALERT_URL%%\?*}"
          url_secrets=("$ALERT_URL" "${url_path##*/}")
          case "$ALERT_URL" in
            *\?*)
              IFS='&' read -ra url_params <<<"${ALERT_URL#*\?}"
              for param in "${url_params[@]}"; do url_secrets+=("${param#*=}"); done ;;
          esac
          for part in "${url_secrets[@]}"; do
            if test "${#part}" -ge 8; then echo "::add-mask::$part"; fi
          done
          payload="$(jq -nc --arg app "$APP" --arg mode "$MODE" --arg repo "$REPO" --arg sha "$GITHUB_SHA" --arg job "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{title: "Delivery failed: \($app) (\($mode))",
              description: "\($repo) @ \($sha[0:12]) failed to deliver (\($mode)). Run: \($job)",
              deduplication_key: "deliver-\($repo)-\($mode)-\($sha)",
              status: "firing"}')"
          response="$(mktemp)"
          code="$(curl -sS -o "$response" -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' -d "$payload" "$ALERT_URL" 2>/dev/null || true)"
          case "$code" in 2??) echo "Alert sent."; exit 0 ;; esac
          # One line with no control characters, so it cannot start a workflow command.
          body="$(tr '[:cntrl:]' ' ' <"$response")"
          for part in "${url_secrets[@]}"; do
            if test "${#part}" -ge 8; then body="${body//"$part"/[redacted]}"; fi
          done
          # This job runs only after another job failed, and nothing needs it, so
          # failing here cannot change the run's result. It makes the lost alert visible.
          echo "::error::incident.io did not record the alert: HTTP ${code:-none}. Response: ${body:0:1000}"
          exit 1
          # END alert-post
